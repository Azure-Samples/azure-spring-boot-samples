spring:
  config:
    import: optional:file:${user.home}/cosmos-v4.properties
  data:
    cosmos:
      uri: ${ACCOUNT_HOST}
      key: ${ACCOUNT_KEY}
      secondaryKey: ${SECONDARY_ACCOUNT_KEY}
      databaseName: ${COSMOS_DATABASE:testdb}
      preferredRegions: ${PREFERRED_LOCATIONS:}
      endToEndTimeout: ${COSMOS_END_TO_END_TIMEOUT:}
      availabilityThreshold: ${COSMOS_AVAILABILITY_THRESHOLD:PT0.5S}
      availabilityThresholdStep: ${COSMOS_AVAILABILITY_THRESHOLD_STEP:PT0.1S}
      # Set to true to populate query metrics -
      # NOTE: this will NOT give request information about point reads (only queries)
      # See https://aka.ms/PointReadsInSpring for more information on the difference between point reads and queries.
      queryMetricsEnabled: false

