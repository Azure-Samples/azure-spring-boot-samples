spring:
  main:
    web-application-type: none
  config:
    import: optional:file:${user.home}/cosmos-v4.properties

cosmos:
  endpoint: ${ACCOUNT_HOST}
  key: ${ACCOUNT_KEY:}
  database: ${COSMOS_DATABASE:query-availability-sample}
  preferred-regions: ${PREFERRED_LOCATIONS:}
  end-to-end-timeout: ${COSMOS_END_TO_END_TIMEOUT:PT5S}
  availability:
    threshold: ${COSMOS_AVAILABILITY_THRESHOLD:PT0.5S}
    threshold-step: ${COSMOS_AVAILABILITY_THRESHOLD_STEP:PT0.1S}
