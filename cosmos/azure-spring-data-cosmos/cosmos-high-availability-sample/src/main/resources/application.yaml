spring:
  main:
    web-application-type: none
  config:
    import: optional:file:${user.home}/cosmos-v4.properties
  data:
    cosmos:
      uri: ${ACCOUNT_HOST}
      key: ${ACCOUNT_KEY:}
      databaseName: ${COSMOS_DATABASE:cosmos-high-availability-sample}
      preferredRegions: ${PREFERRED_LOCATIONS:}
      endToEndTimeout: ${COSMOS_END_TO_END_TIMEOUT:PT10S}
      availabilityThreshold: ${COSMOS_AVAILABILITY_THRESHOLD:PT5S}
      availabilityThresholdStep: ${COSMOS_AVAILABILITY_THRESHOLD_STEP:PT0.1S}
      readFailureThreshold: ${COSMOS_PPCB_READ_FAILURE_THRESHOLD:10}
      writeFailureThreshold: ${COSMOS_PPCB_WRITE_FAILURE_THRESHOLD:5}
